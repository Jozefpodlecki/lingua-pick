[package]
name = "lingua-cli"
version = "0.1.0"
edition = "2024"
description = ""
license-file = "../../LICENSE"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
jsonschema = { version = "0.58.6", default-features = false }
getrandom = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tokio = { version = "1.48.0", features = ["rt", "macros", "process", "time"] }
thiserror = "*"
uuid = "*"
chrono = "*"
r2d2 = "*"
sha2 = "0.11"
hex = "0.4"
argon2 = "0.6.0"
rand_core = { version = "0.10.1"}
duckdb-neo = { git = "https://github.com/duckdb/duckdb-rs.git", features = ["chrono", "r2d2", "uuid" ] }
whisper-rs = "0.16.0"
lingua-ai = { path = "../lingua-ai" }
lingua-store = { path = "../lingua-store" }

[dev-dependencies]
